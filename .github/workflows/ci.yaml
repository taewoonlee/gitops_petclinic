name: Build, Push, and Update Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Fix Maven Wrapper
      run: |
        sed -i 's/\r$//' mvnw
        chmod +x mvnw
        ls -al mvnw
        head -1 mvnw

    - name: Build with Maven Wrapper
      run: ./mvnw package -DskipTests

    - name: Configure AWS credentials
      if: github.event_name == 'push'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-2

    - name: Login to Amazon ECR
      if: github.event_name == 'push'
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      if: github.event_name == 'push'
      env:
        ECR_REGISTRY: 818521988849.dkr.ecr.ap-northeast-2.amazonaws.com
        ECR_REPOSITORY: bluerain-gitops-repo
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Update Deployment YAML
      if: github.event_name == 'push'
      run: |
        sed -i "s|image: .*|image: 818521988849.dkr.ecr.ap-northeast-2.amazonaws.com/bluerain-gitops-repo:${{ github.sha }}|" k8s/deployment.yaml

    - name: Commit and push if there are changes
      if: github.event_name == 'push'
      run: |
        git config user.name "GitHub Actions"
        git config user.email "github-actions@github.com"
        git add k8s/deployment.yaml

        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update image tag to ${{ github.sha }}"
          git pull --rebase origin main
          git push origin HEAD:main
        fi
